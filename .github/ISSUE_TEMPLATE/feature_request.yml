name: 功能建议
description: 希望支持某个协议、某类检测，或某种工作流
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 描述今天做不到的分析。先别急着给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 工具应该怎么变？命令行参数、界面、输出格式……
  - type: dropdown
    id: kind
    attributes:
      label: 改动类型
      options:
        - 新协议支持
        - 新检测 / 规则
        - 新导出格式
        - 界面改进
        - 性能
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有工具怎么做？为什么显然的做法不可行？
  - type: checkboxes
    id: constraints
    attributes:
      label: 项目约束
      options:
        - label: 该功能可以在不给引擎引入运行时依赖的前提下实现
          required: true
        - label: 该功能不需要数据包注入、拦截或窃取凭据
          required: true
