name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A step-level `if` can read `env` but not `secrets`, and a step-level `env`
    # is not in scope for that same step's `if`. Job-level env is the one place
    # the token can live and still be testable.
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify the wheel is self-contained
        run: |
          python -m pip install dist/*.whl
          voxhound version
          python -m voxhound demo --quiet --report /tmp/demo.html
          test -s /tmp/demo.html
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload --skip-existing dist/*
      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
