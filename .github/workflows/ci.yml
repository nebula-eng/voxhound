name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # keep the matrix small on the two slower runners
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (engine only — must stay dependency-free)
        run: python -m pip install -e ".[dev]"
      - name: Assert no third-party imports in the engine
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in pathlib.Path("voxhound").rglob("*.py"):
              if "ui" in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:      # relative import inside the package
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name != "voxhound":
                          offenders.append(f"{path}: {name}")
          if offenders:
              print("\n".join(offenders))
              raise SystemExit("engine imported a third-party module")
          print("engine imports: stdlib only")
          PY
      - name: Lint
        run: |
          python -m ruff check voxhound tests scripts
          python -m ruff format --check voxhound tests scripts
      - name: Test
        run: python -m pytest -q --cov=voxhound --cov-report=xml
      - name: CLI smoke test
        run: |
          python -m voxhound version
          python -m voxhound demo --quiet --report demo.html --json demo.json
          python -m voxhound interfaces

  gui:
    name: desktop (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install
        run: python -m pip install -e ".[gui]"
      - name: Import the UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from voxhound.ui.app import build_application
          from voxhound.ui.main_window import MainWindow
          app = build_application([])
          window = MainWindow()
          window.resize(1280, 800)
          window.show()
          app.processEvents()
          window.grab().save("ui-smoke.png")
          print("UI constructed and rendered")
          PY

  package:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Wheel import check
        run: |
          python -c "import voxhound; print(voxhound.__version__)"
          voxhound version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
