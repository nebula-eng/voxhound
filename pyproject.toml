[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxhound"
version = "1.0.0"
description = "VoxHound —— 面向语音与媒体流量的被动网络取证工作台：零依赖引擎、深度协议解析、Qt 桌面端。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VoxHound contributors" }]
keywords = ["network", "forensics", "pcap", "pcapng", "voip", "rtp", "tls", "ja4", "packet-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
voxhound = "voxhound.cli:main"

[project.gui-scripts]
voxhound-gui = "voxhound.ui.app:main"

[project.urls]
Homepage = "https://github.com/nebula-eng/voxhound"
Documentation = "https://github.com/nebula-eng/voxhound/tree/main/docs"
Issues = "https://github.com/nebula-eng/voxhound/issues"
Changelog = "https://github.com/nebula-eng/voxhound/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["voxhound*"]

[tool.setuptools.package-data]
voxhound = ["rules/*.json", "py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:voxhound.*",
    # An unclosed file or database is a leak, not a nuisance: fail the suite.
    "error::ResourceWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PL"]
ignore = [
    "PLR0913", "PLR0915", "PLR0912", "PLR2004", "E501",
    "PLC0415",  # lazy imports keep the zero-dependency engine Qt-free
    "ARG001", "ARG002",  # Qt overrides and protocol stubs take fixed signatures
    "PLR0911", "PLR0917", "B008", "SIM102", "PLW0603", "PLC3002", "B905",
]

[tool.coverage.run]
source = ["voxhound"]
omit = ["voxhound/ui/*"]
